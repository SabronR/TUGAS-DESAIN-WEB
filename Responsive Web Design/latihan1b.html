<!DOCTYPE html>
<html>
<head>
    <title>Menggunakan Media Query CSS3 - Logo UNS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .smartphone {
            display: none;
        }

        .desktop-logo {
            display: none;
            margin-top: 20px;
        }

        .desktop-logo img {
            width: 150px;
            height: auto;
        }

        @media only screen and (max-width: 428px) {
            body {
                background-color: yellow;
            }
            .smartphone {
                display: block;
            }
        }

        @media only screen and (min-width: 1025px) {
            .desktop-logo {
                display: block;
            }
        }
    </style>
</head>
<body>
    <h3>Menggunakan Media Query CSS 3</h3>
    
    <div class="smartphone">
        <h2>Terdeteksi ukuran smartphone</h2>
    </div>

    <div class="desktop-logo">
        <h2>Terdeteksi ukuran Desktop (>1024px)</h2>
        <img src="LOGO UNS.png" alt="Logo UNS"> 
    </div>
</body>
</html>
